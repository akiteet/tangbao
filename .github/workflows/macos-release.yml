name: macOS release package

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to package
        required: true
        default: master
        type: string
      release_tag:
        description: Existing GitHub Release to receive the installers
        required: true
        default: v1.1.4
        type: string
      upload_release:
        description: Upload installers to the existing release
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native dependencies for Electron
        run: npx electron-builder install-app-deps

      - name: Check Electron native ABI
        run: npm run check:electron-abi

      - name: Run test suite
        run: npm test

      - name: Run release checks
        run: npm run check:release

      - name: Build ${{ matrix.arch }} installers
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never

      - name: Verify installers
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test -f "dist/tangbao-${VERSION}-${{ matrix.arch }}.dmg"
          test -f "dist/tangbao-${VERSION}-${{ matrix.arch }}.zip"
          shasum -a 256 "dist/tangbao-${VERSION}-${{ matrix.arch }}.dmg" > "dist/tangbao-${VERSION}-${{ matrix.arch }}.dmg.sha256"
          shasum -a 256 "dist/tangbao-${VERSION}-${{ matrix.arch }}.zip" > "dist/tangbao-${VERSION}-${{ matrix.arch }}.zip.sha256"
          ls -lh dist/*.dmg dist/*.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tangbao-macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Upload macOS installers to release
    if: ${{ inputs.upload_release }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lh release-assets/*.dmg release-assets/*.zip release-assets/*.sha256

      - name: Upload installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" release-assets/*.dmg release-assets/*.zip release-assets/*.sha256 --repo "${{ github.repository }}" --clobber
