name: Build macOS release assets

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Release tag or commit to package
        required: true
        default: v1.1.8
        type: string
      release_tag:
        description: Existing GitHub Release to receive the assets
        required: true
        default: v1.1.8
        type: string

permissions:
  contents: write

jobs:
  macos:
    name: macOS ${{ matrix.arch }} release assets
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native dependencies for Electron
        run: npx electron-builder install-app-deps

      - name: Validate release source
        run: |
          npm test
          npm run check:version
          npm run check:release
          npm run check:electron-abi

      - name: Build macOS DMG and ZIP
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never

      - name: Generate checksums
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for file in "dist/tangbao-${VERSION}-${{ matrix.arch }}.dmg" "dist/tangbao-${VERSION}-${{ matrix.arch }}.zip"; do
            test -f "$file"
            shasum -a 256 "$file" > "$file.sha256"
          done

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: tangbao-v1.1.8-macos-${{ matrix.arch }}
          path: |
            dist/tangbao-*.dmg
            dist/tangbao-*.zip
            dist/tangbao-*.dmg.sha256
            dist/tangbao-*.zip.sha256
          if-no-files-found: error

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release upload "${{ inputs.release_tag }}" \
            "dist/tangbao-${VERSION}-${{ matrix.arch }}.dmg" \
            "dist/tangbao-${VERSION}-${{ matrix.arch }}.zip" \
            "dist/tangbao-${VERSION}-${{ matrix.arch }}.dmg.sha256" \
            "dist/tangbao-${VERSION}-${{ matrix.arch }}.zip.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
