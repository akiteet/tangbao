<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
/* 全局重置与基础样式 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:transparent;overflow:hidden}
html.solid,html.solid body{background:#171717}
/* 背景层：纯色兜底，可被 --splash-bg 覆盖为渐变 */
body::before{content:"";position:fixed;inset:0;background:var(--splash-bg,#171717)}
body::after{content:"";position:fixed;inset:0;border:3px solid rgba(255,255,255,.16);pointer-events:none}
/* 内容居中容器：淡入淡出，禁用选择与滚动 */
body{display:flex;align-items:center;justify-content:center;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;opacity:0;transition:opacity 160ms ease-out;user-select:none;cursor:default;position:relative}
body>div{position:relative;isolation:isolate}
/* 核心视觉：conic-gradient 描边经 mask 挖空形成旋转进度环，ready/is-done 控制显隐 */
body>div::before{content:"";position:fixed;inset:2px;padding:3px;border:3px solid transparent;background:conic-gradient(from -35deg,transparent 0deg 300deg,color-mix(in srgb,var(--splash-accent,#4c80ff) 18%,transparent) 316deg,var(--splash-accent,#4c80ff) 326deg 336deg,color-mix(in srgb,var(--splash-accent,#4c80ff) 18%,transparent) 352deg,transparent 360deg) border-box;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;opacity:0;pointer-events:none;z-index:0;transition:opacity 220ms ease-out;animation:splash-border-flow 2.6s linear infinite}
body.ready>div::before{opacity:.92}
body.is-done>div::before{opacity:0;transition:opacity 120ms ease-in}
/* 旋转动画与状态类切换 */
@keyframes splash-border-flow{to{transform:rotate(360deg)}}
body.ready{opacity:1}
body.is-done{opacity:0;transition:opacity 160ms ease-in}
canvas{display:block;position:relative;z-index:1}
/* 文字兜底：canvas 不可用时显示 */
#fallback{display:none;position:relative;z-index:1;font-size:56px;font-weight:800;letter-spacing:6px;padding:0 28px;color:#fafafa}
/* 无障碍：尊重"减少动态效果"偏好，改为静态呈现 */
@media(prefers-reduced-motion:reduce){body>div::before{animation:none;opacity:0}body{opacity:1;transition:none}body.is-done{transition:none}}
</style>
</head>
<body>
<!-- 状态容器供屏幕阅读器播报"启动中"；canvas 绘制像素字，fallback 为降级文本 -->
<div role="status" aria-label="TangBao 启动中"><canvas id="word" width="10" height="10"></canvas><div id="fallback">TangBao</div></div>
<script>
/[?&]bg=solid/.test(location.search)&&document.documentElement.classList.add("solid");
requestAnimationFrame(function(){document.body.classList.add("ready")});
(function(){
/* 工具函数：取元素、切换兜底显示 */
function q(i){return document.getElementById(i)}
function fb(){q("word").style.display="none";q("fallback").style.display="block"}
/* 主流程：绘制像素字牌，任一环节异常即降级 */
function pm(){
q("fallback").textContent="TangBao";
/* 要渲染的词，及点阵字形表：每字母为 X/. 模板，t 为该字符相对顶部的偏移行 */
var W="Tangbao",G={
T:{t:0,r:["XXXXX","..X..","..X..","..X..","..X..","..X..","..X.."]},
a:{t:2,r:["XXXXX","X...X","XXXXX","X...X","X...X"]},
n:{t:2,r:["XXXX.","X...X","X...X","X...X","X...X"]},
g:{t:2,r:["XXXXX","X...X","X...X","X...X","XXXXX","....X","XXXXX"]},
b:{t:0,r:["X....","X....","XXXXX","X...X","X...X","X...X","XXXXX"]},
o:{t:2,r:["XXXXX","X...X","X...X","X...X","XXXXX"]}},
i,j,k,cols=0,GR=[],pen=0;
/* 字形拼接：按各字符宽度累加（含 1 列间距），生成 cols×9 的布尔栅格 */
for(i=0;i<W.length;i++){var h=G[W.charAt(i)];if(!h)throw new Error("missing_glyph:"+W.charAt(i));cols+=h.r[0].length+(i?1:0)}
for(i=0;i<9;i++){var L=[];for(k=0;k<cols;k++)L.push(0);GR.push(L)}
for(i=0;i<W.length;i++){var x=G[W.charAt(i)];for(j=0;j<x.r.length;j++)for(k=0;k<x.r[j].length;k++)if(x.r[j].charAt(k)==="X")GR[x.t+j][pen+k]=1;pen+=x.r[0].length+1}
var rows=9,top=0,bottom=8,left=0,right=cols-1,
rh=function(c){return GR.some(function(l){return l[c]})};
/* 边界裁剪：去掉四周空白行/列，得到实际内容尺寸 */
while(top<=bottom&&!GR[top].some(function(v){return v}))top++;
while(bottom>=top&&!GR[bottom].some(function(v){return v}))bottom--;
while(left<=right&&!rh(left))left++;
while(right>=left&&!rh(right))right--;
if(top>bottom||left>right)throw new Error("empty_grid");
rows=bottom-top+1;cols=right-left+1;
/* canvas 尺寸：单元格随内容自适应缩放（3–15px），按 devicePixelRatio 放大保证清晰；PAD 预留右侧光标列 */
var cv=q("word"),ctx=cv.getContext("2d"),
CELL=Math.max(3,Math.min(15,Math.floor(Math.min(540/(cols+4),180/rows)))),
D=Math.max(1,Math.round(CELL*(window.devicePixelRatio||1))),
PAD=2,NC=PAD*2+cols+2;
cv.width=NC*D;cv.height=rows*D;
cv.style.width=NC*CELL+"px";cv.style.height=rows*CELL+"px";
/* 列渐变色：灰度由左向右 138→255 线性过渡，形成立体扫光基底 */
var CC=[],CV=[],v;
for(i=0;i<cols;i++){v=Math.round(138+(255-138)*(cols>1?i/(cols-1):0));CV.push(v);CC.push("rgb("+v+","+v+","+v+")")}
/* 收集所有亮块坐标，供闪烁粒子采样 */
var cxs=[],cys=[];
for(j=0;j<rows;j++)for(i=0;i<cols;i++)if(GR[j+top][i+left]){cxs.push(i);cys.push(j)}
if(!cxs.length)throw new Error("empty_grid");
/* accent 参数：由主色派生提亮后的文字色与 135° 暗调渐变背景，写入 CSS 变量供样式层使用 */
var accM=/[?&]accent=([0-9a-fA-F]{6})/.exec(location.search),
acc=accM?accM[1].toLowerCase():"",TC="";
if(acc){
var ar=[parseInt(acc.substr(0,2),16),parseInt(acc.substr(2,2),16),parseInt(acc.substr(4,2),16)],
f=function(z){return Math.round(z+(255-z)*.22)},
mt=function(z,t){return Math.round(23+(z-23)*t)},
rs=document.documentElement.style;
TC="rgb("+f(ar[0])+","+f(ar[1])+","+f(ar[2])+")";
rs.setProperty("--splash-accent",TC);
rs.setProperty("--splash-bg","linear-gradient(135deg, rgb("+mt(ar[0],.08)+","+mt(ar[1],.08)+","+mt(ar[2],.08)+") 0%, rgb("+mt(ar[0],.16)+","+mt(ar[1],.16)+","+mt(ar[2],.16)+") 100%)");
}
/* 闪烁粒子系统：随机亮块位置、延迟、单次时长与剩余闪烁次数 */
var TW=[],
spawn=function(now){return{i:(Math.random()*cxs.length)|0,t0:now+Math.random()*720,dur:900+Math.random()*720,cycles:1+((Math.random()*3)|0)}},
init=function(now){var n=Math.max(10,Math.round(cxs.length*.14));TW.length=0;for(var z=0;z<n;z++)TW.push(spawn(now))},
reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches,
COL=cols+1,CROWS=7,CPER=1060,SWW=2,SWD=880,t0=performance.now();
function tile(gx,gy){ctx.fillRect(gx*D,gy*D,D,D)}
/* drawSolid：按列扫描，将连续亮块合并为矩形绘制；扫光带内按距离提升亮度 */
function drawSolid(maxCol,now){
var sa=now-t0,sc=sa>=0&&sa<=SWD?(sa/SWD)*(cols+SWW*2)-SWW:-Infinity,c,r,run,on,lf,sv;
for(c=0;c<=maxCol&&c<cols;c++){
run=-1;
for(r=0;r<=rows;r++){
on=r<rows&&GR[r+top][c+left]===1;
if(on&&run<0)run=r;
else if(!on&&run>=0){
lf=Math.abs(c-sc)<=SWW?(1-Math.abs(c-sc)/SWW)*.14:0;
sv=Math.min(255,Math.round(CV[c]+(255-CV[c])*lf));
ctx.fillStyle=lf>0?"rgb("+sv+","+sv+","+sv+")":CC[c];
ctx.fillRect(c*D,run*D,D,(r-run)*D);
run=-1;
}
}
}
}
/* drawFrame：清屏 → 平移 PAD 留出光标列 → 绘制主体 → 右侧光标块（呼吸闪烁）→ 叠加粒子 */
function drawFrame(now,maxCol){
ctx.clearRect(0,0,cv.width,cv.height);
ctx.save();ctx.translate(PAD*D,0);
drawSolid(maxCol,now);
if(maxCol>=cols-1&&(reduce||(now-t0)%CPER<CPER/2)){
ctx.fillStyle=TC||CC[cols-1];
for(var cr=0;cr<CROWS;cr++)tile(COL,cr);
}
for(var z=0;z<TW.length;z++){
var tw=TW[z],el=now-tw.t0;
if(el<0)continue;
if(el>=tw.dur){tw.cycles--;if(tw.cycles<=0){TW[z]=spawn(now);continue}tw.t0+=tw.dur;continue}
if(cxs[tw.i]>maxCol)continue;
ctx.fillStyle=CC[cxs[tw.i]];
ctx.globalAlpha=.72+.28*Math.pow(Math.sin(el/tw.dur*Math.PI),2);
tile(cxs[tw.i],cys[tw.i]);
}
ctx.globalAlpha=1;ctx.restore();
}
/* 减少动态效果时只静态绘制一帧，不进动画循环 */
if(reduce){drawFrame(t0,cols-1);return}
/* 主循环：620ms 入场逐列揭开（easeOutCubic 缓动），揭开完成后启动粒子系统 */
var fl=false;
function frame(now){
var p=Math.min(1,(now-t0)/620);
if(p>=1&&!fl){fl=true;init(now)}
drawFrame(now,fl?cols-1:Math.floor((1-Math.pow(1-p,3))*(cols-1)));
requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
}
/* 错误兜底：任一环节异常则隐藏 canvas，退回纯文字展示 */
try{pm()}catch(e){fb()}
})();
</script>
</body>
</html>
